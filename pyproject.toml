[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-engineering-graphrag"
version = "0.1.0"
description = "Evidence-based retrieval across documents and asset relations."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["urbanrag*"]
